<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>StudyPal</title>
  <link rel="icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="StudyPal">
  <meta name="theme-color" content="#e9eae6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn drawer-btn" data-act="open-drawer" title="Subjects and settings" aria-label="Subjects and settings">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button class="brand" data-go="overview" title="Back to the overview">
      <span class="brand-mark" aria-hidden="true"></span>StudyPal
    </button>
    <span class="today" id="today"></span>
    <div class="topbar-actions">
      <span id="jobs" aria-live="polite"></span>
      <button class="btn" data-act="log-time">Log study time</button>
      <button class="btn primary" data-act="start-studying">Start studying</button>
    </div>
  </header>
  <div class="shell">
    <aside id="sidebar" aria-label="Subjects and projects">
      <button class="icon-btn side-toggle" data-act="toggle-sidebar" title="Collapse sidebar" aria-label="Collapse sidebar" aria-expanded="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
      <nav id="side-nav"></nav>
      <div class="side-foot">
        <span id="account"></span>
        <button class="icon-btn" data-act="settings" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </aside>
    <div class="content">
      <div id="running"></div>
      <div id="banner"></div>
      <main id="view" tabindex="-1"><p class="loading">Loading…</p></main>
      <footer id="overall" hidden></footer>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <script src="bridge.js"></script>
  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="themes.js"></script>
  <script src="app.js"></script>
  <script src="banners.js"></script>
  <script src="exams.js"></script>
  <script src="research.js"></script>
</body>
</html>
